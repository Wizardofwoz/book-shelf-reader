le act well,’ answered the Miller; ‘but very few people talk well, which shows that talking is much the more difficult thing of the two, and much the finer thing also’; and he looked sternly across the table at his little son, who felt so ashamed of himself that he hung his head down, and grew quite scarlet, and began to cry into his tea. However, he was so young that you must excuse him.”","“Is that the end of the story?” asked the Water-rat.","“Certainly not,” answered the Linnet, “that is the beginning.”","“Then you are quite behind the age,” said the Water-rat. “Every good story-teller nowadays starts with the end, and then goes on to the beginning, and concludes with the middle. That is the new method. I heard all about it the other day from a critic who was walking round the pond with a young man. He spoke of the matter at great length, and I am sure he must have been right, for he had blue spectacles and a bald head, and whenever the young man made any remark, he always answered ‘Pooh!’ But pray go on with your story. I like the Miller immensely. I have all kinds of beautiful sentiments myself, so there is a great sympathy between us.”","“Well,” said the Linnet, hopping now on one leg and now on the other, “as soon as the winter was over, and the primroses began to open their pale yellow stars, the Miller said to his wife that he would go down and see little Hans.","“‘Why, what a good heart you have!’ cried his Wife; ‘you are always thinking of others. And mind you take the big basket with you for the flowers.’","“So the Miller tied the sails of the windmill together with a strong iron chain, and went down the hill with the basket on his arm.","“‘Good morning, little Hans,’ said the Miller.","“‘Good morning,’ said Hans, leaning on his spade, and smiling from ear to ear.","“‘And how have you been all the winter?’ said the Miller.","“‘Well, really,’ cried Hans, ‘it is very good of you to ask, very good indeed. I am afraid I had rather a hard time of it, but now the spring has come, and I am quite happy, and all my flowers are doing well.’","“‘We often talked of you during the winter, Hans,’ said the Miller, ‘and wondered how you were getting on.’","“‘That was kind of you,’ said Hans; ‘I was half afraid you had forgotten me.’","“‘Hans, I am surprised at you,’ said the Miller; ‘friendship never forgets. That is the wonderful thing about it, but I am afraid you don’t understand the poetry of life. How lovely your primroses are looking, by-the-bye!”","“‘They are certainly very lovely,’ said Hans, ‘and it is a most lucky thing for me that I have so many. I am going to bring them into the market and sell them to the Burgomaster’s daughter, and buy back my wheelbarrow with the money.’","“‘Buy back your wheelbarrow? You don’t mean to say you have sold it? What a very stupid thing to do!’","“‘Well, the fact is,’ said Hans, ‘that I was obliged to. You see the winter was a very bad time for me, and I really had no money at all to buy bread with. So I first sold the silver buttons off my Sunday coat, and then I sold my silver chain, and then I sold my big pipe, and at last I sold my wheelbarrow. But I am going to buy them all back again now.’","“‘Hans,’ said the Miller, ‘I will give you my wheelbarrow. It is not in very good repair; indeed, one side is gone, and there is something wrong with the wheel-spokes; but in spite of that I will give it to you. I know it is very generous of me, and a great many people would think me extremely foolish for parting with it, but I am not like the rest of the world. I think that generosity is the essence of friendship, and, besides, I have got a new wheelbarrow for myself. Yes, you may set your mind at ease, I will give you my wheelbarrow.’","“‘Well, really, that is generous of you,’ said little Hans, and his funny round face glowed all over with pleasure. ‘I can easily put it in repair, as I have a plank of wood in the house.’","“‘A plank of wood!’ said the Miller; ‘why, that is just what I want for the roof of my barn. There is a very large hole in it, and the corn will all get damp if I don’t stop it up. How lucky you mentioned it! It is quite remarkable how one good action always breeds another. I have given you my wheelbarrow, and now you are going to give me your plank. Of course, the wheelbarrow is worth far more than the plank, but true, friendship never notices things like that. Pray get it at once, and I will set to work at my barn this very day.’","“‘Certainly,’ cried little Hans, and he ran into the shed and dragged the plank out.","“‘It is not a very big plank,’ said the Miller, looking at it, ‘and I am afraid that after I have mended my barn-roof there won’t be any left for you to mend the wheelbarrow with; but, of course, that is not my fault. And now, as I have given you my wheelbarrow, I am sure you would like to give me some flowers in return. Here is the basket, and mind you fill it quite full.’","“‘Quite full?’ said little Hans, rather sorrowfully, for it was really a very big basket, and he knew that if he filled it he would have no flowers left for the market and he was very anxious to get his silver buttons back.","“‘Well, really,’ answered the Miller, ‘as I have given you my wheelbarrow, I don’t think that it is much to ask you for a few flowers. I may be wrong, but I should have thought that friendship, true friendship, was quite free from selfishness of any kind.’","“‘My dear friend, my best friend,’ cried little Hans, ‘you are welcome to all the flowers in my garden. I would much sooner have your good opinion than my silver buttons, any day’; and he ran and plucked all his pretty primroses, and filled the Miller’s basket.","“‘Good-bye, little Hans,’ said the Miller, as he went up the hill with the plank on his shoulder, and the big basket in his hand.","“‘Good-bye,’ said little Hans, and he began to dig away quite merrily, he was so pleased about the wheelbarrow.","“The next day he was nailing up some honeysuckle against the porch, when he heard the Miller’s voice calling to him from the road. So he jumped off the ladder, and ran down the garden, and looked over the wall.","“There was the Miller with a large sack of flour on his back.","“‘Dear little Hans,’ said the Miller, ‘would you mind carrying this sack of flour for me to market?’","“‘Oh, I am so sorry,’ said Hans, ‘but I am really very busy to-day. I have got all my creepers to nail up, and all my flowers to water, and all my grass to roll.’","“‘Well, really,’ said the Miller, ‘I think that, considering that I am going to give you my wheelbarrow, it is rather unfriendly of you to refuse.’","“‘Oh, don’t say that,’ cried little Hans, ‘I wouldn’t be unfriendly for the whole world’; and he ran in for his cap, and trudged off with the big sack on his shoulders.","“It was a very hot day, and the road was terribly dusty, and before Hans had reached the sixth milestone he was so tired that he had to sit down and rest. However, he went on bravely, and as last he reached the market. After he had waited there some time, he sold the sack of flour for a very good price, and then he returned home at once, for he was afraid that if he stopped too late he might meet some robbers on the way.","“‘It has certainly been a hard day,’ said little Hans to himself as he was going to bed, ‘but I am glad I did not refuse the Miller, for he is my best friend, and, besides, he is going to give me his wheelbarrow.’","“Early the next morning the Miller came down to get the money for his sack of flour, but little Hans was so tired that he was still in bed.","“‘Upon my word,’ said the Miller, ‘you are very lazy. Really, considering that I am going to give you my wheelbarrow, I think you might work harder. Idleness is a great sin, and I certainly don’t like any of my friends to be idle or sluggish. You must not mind my speaking quite plainly to you. Of course I should not dream of doing so if I were not your friend. But what is the good of friendship if one cannot say exactly what one means? Anybody can say charming things and try to please and to flatter, but a true friend always says unpleasant things, and does not mind giving pain. Indeed, if he is a really true friend he prefers it, for he knows that then he is doing good.’","“‘I am very sorry,’ said little Hans, rubbing his eyes and pulling off his night-cap, ‘but I was so tired that I thought I would lie in bed for a little time, and listen to the birds singing. Do you know that I always work better after hearing the birds sing?’","“‘Well, I am glad of that,’ said the Miller, clapping little Hans on the back, ‘for I want you to come up to the mill as soon as you are dressed, and mend my barn-roof for me.’","“Poor little Hans was very anxious to go and work in his garden, for his flowers had not been watered for two days, but he did not like to refuse the Miller, as he was such a good friend to him.","“‘Do you think it would be unfriendly of me if I said I was busy?’ he inquired in a shy and timid voice.","“‘Well, really,’ answered the Miller, ‘I do not think it is much to ask of you, considering that I am going to give you my wheelbarrow; but of course if you refuse I will go and do it myself.’","“‘Oh! on no account,’ cried little Hans and he jumped out of bed, and dressed himself, and went up to the barn.","“He worked there all day long, till sunset, and at sunset the Miller came to see how he was getting on.","“‘Have you mended the hole in the roof yet, little Hans?’ cried the Miller in a cheery voice.","“‘It is quite mended,’ answered little Hans, coming down the ladder.","“‘Ah!’ said the Miller, ‘there is no work so delightful as the work one does for others.’","“‘It is certainly a great privilege to hear you talk,’ answered little Hans, sitting down, and wiping his forehead, ‘a very great privilege. But I am afraid I shall never have such beautiful ideas as you have.’","“‘Oh! they will come to you,’ said the Miller, ‘but you must take more pains. At present you have only the practice of friendship; some day you will have the theory also.’","“‘Do you really think I shall?’ asked little Hans.","“‘I have no doubt of it,’ answered the Miller, ‘but now that you have mended the roof, you had better go home and rest, for I want you to drive my sheep to the mountain to-morrow.’","“Poor little Hans was afraid to say anything to this, and early the next morning the Miller brought his sheep round to the cottage, and Hans started off with them to the mountain. It took him the whole day to get there and back; and when he returned he was so tired that he went off to sleep in his chair, and did not wake up till it was broad daylight.","“‘What a delightful time I shall have in my garden,’ he said, and he went to work at once.","“But somehow he was never able to look after his flowers at all, for his friend the Miller was always coming round and sending him off on long errands, or getting him to help at the mill. Little Hans was very much distressed at times, as he was afraid his flowers would think he had forgotten them, but he consoled himself by the reflection that the Miller was his best friend. ‘Besides,’ he used to say, ‘he is going to give me his wheelbarrow, and that is an act of pure generosity.’","“So little Hans worked away for the Miller, and the Miller said all kinds of beautiful things about friendship, which Hans took down in a note-book, and used to read over at night, for he was a very good scholar.","“Now it happened that one evening little Hans was sitting by his fireside when a loud rap came at the door. It was a very wild night, and the wind was blowing and roaring round the house so terribly that at first he thought it was merely the storm. But a second rap came, and then a third, louder than any of the others.","“‘It is some poor traveller,’ said little Hans to himself, and he ran to the door.","“There stood the Miller with a lantern in one hand and a big stick in the other.","“‘Dear little Hans,’ cried the Miller, ‘I am in great trouble. My little boy has fallen off a ladder and hurt himself, and I am going for the Doctor. But he lives so far away, and it is such a bad night, that it has just occurred to me that it would be much better if you went instead of me. You know I am going to give you my wheelbarrow, and so, it is only fair that you should do something for me in return.’","“‘Certainly,’ cried little Hans, ‘I take it quite as a compliment your coming to me, and I will start off at once. But you must lend me your lantern, as the night is so dark that I am afraid I might fall into the ditch.’","“‘I am very sorry,’ answered the Miller, ‘but it is my new lantern, and it would be a great loss to me if anything happened to it.’","“‘Well, never mind, I will do without it,’ cried little Hans, and he took down his great fur coat, and his warm scarlet cap, and tied a muffler round his throat, and started off.","“What a dreadful storm it was! The night was so black that little Hans could hardly see, and the wind was so strong that he could scarcely stand. However, he was very courageous, and after he had been walking about three hours, he arrived at the Doctor’s house, and knocked at the door.","“‘Who is there?’ cried the Doctor, putting his head out of his bedroom window.","“‘Little Hans, Doctor.’","“’What do you want, little Hans?’","“‘The Miller’s son has fallen from a ladder, and has hurt himself, and the Miller wants you to come at once.’","“‘All right!’ said the Doctor; and he ordered his horse, and his big boots, and his lantern, and came downstairs, and rode off in the direction of the Miller’s house, little Hans trudging behind him.","“But the storm grew worse and worse, and the rain fell in torrents, and little Hans could not see where he was going, or keep up with the horse. At last he lost his way, and wandered off on the moor, which was a very dangerous place, as it was full of deep holes, and there poor little Hans was drowned. His body was found the next day by some goatherds, floating in a great pool of water, and was brought back by them to the cottage.","“Everybody went to little Hans’ funeral, as he was so popular, and the Miller was the chief mourner.","“‘As I was his best friend,’ said the Miller, ‘it is only fair that I should have the best place’; so he walked at the head of the procession in a long black cloak, and every now and then he wiped his eyes with a big pocket-handkerchief.","“‘Little Hans is certainly a great loss to every one,’ said the Blacksmith, when the funeral was over, and they were all seated comfortably in the inn, drinking spiced wine and eating sweet cakes.","“‘A great loss to me at any rate,’ answered the Miller; ‘why, I had as good as given him my wheelbarrow, and now I really don’t know what to do with it. It is very much in my way at home, and it is in such bad repair that I could not get anything for it if I sold it. I will certainly take care not to give away anything again. One always suffers for being generous.’”","“Well?” said the Water-rat, after a long pause.","“Well, that is the end,” said the Linnet.","“But what became of the Miller?” asked the Water-rat.","“Oh! I really don’t know,” replied the Linnet; “and I am sure that I don’t care.”","“It is quite evident then that you have no sympathy in your nature,” said the Water-rat.","“I am afraid you don’t quite see the moral of the story,” remarked the Linnet.","“The what?” screamed the Water-rat.","“The moral.”","“Do you mean to say that the story has a moral?”","“Certainly,” said the Linnet.","“Well, really,” said the Water-rat, in a very angry manner, “I think you should have told me that before you began. If you had done so, I certainly would not have listened to you; in fact, I should have said ‘Pooh,’ like the critic. However, I can say it now”; so he shouted out “Pooh” at the top of his voice, gave a whisk with his tail, and went back into his hole.","“And how do you like the Water-rat?” asked the Duck, who came paddling up some minutes afterwards. “He has a great many good points, but for my own part I have a mother’s feelings, and I can never look at a confirmed bachelor without the tears coming into my eyes.”","“I am rather afraid that I have annoyed him,” answered the Linnet. “The fact is, that I told him a story with a moral.”","“Ah! that is always a very dangerous thing to do,” said the Duck.","And I quite agree with her."]}]</script>
<script>
(function () {
  var BUILTIN = JSON.parse(document.getElementById("booksData").textContent);
  var CUSTOM_KEY = "reader:custom";
  var COLORS = ["#c9694a", "#3f7a8c", "#8a4a6b", "#5d7a3f", "#d9901a", "#2f5fb3", "#7a2e2e", "#2d2d2d"];
  var DEL_KEY = "reader:deleted", READ_KEY = "reader:read", SORT_KEY = "reader:sort";
  var custom = loadCustom();
  var deleted = loadDeleted();
  var readMap = loadRead();
  var query = "", sortBy = "shelf";
  var freshId = null;
  var SIZE_KEY = "reader:fontSize", POS_KEY = function (id) { return "reader:pos:" + id; };
  var MIN_SIZE = 16, MAX_SIZE = 34;

  var $ = function (id) { return document.getElementById(id); };
  var shelf = $("shelf"), reader = $("reader"), flow = $("flow"), clip = $("clip");
  var cur = null, page = 0, total = 1, pageW = 0, gap = 0, fontSize = 21;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var saved = parseInt(lsGet(SIZE_KEY), 10);
  if (saved >= MIN_SIZE && saved <= MAX_SIZE) fontSize = saved;
  else if (window.innerWidth >= 700) fontSize = 22;

  function loadCustom() {
    try {
      var a = JSON.parse(localStorage.getItem(CUSTOM_KEY));
      if (Array.isArray(a)) return a.filter(function (b) { return b && typeof b.id === "string" && typeof b.title === "string" && b.title; })
        .map(function (b) { return { id: b.id, title: b.title, author: b.author || "", note: b.note || "", color: b.color || COLORS[0], year: b.year || "", custom: true }; });
    } catch (e) {}
    return [];
  }
  function loadDeleted() {
    try { var a = JSON.parse(localStorage.getItem(DEL_KEY)); if (Array.isArray(a)) return a.filter(function (x) { return typeof x === "string"; }); } catch (e) {}
    return [];
  }
  function loadRead() {
    try { var o = JSON.parse(localStorage.getItem(READ_KEY)); if (o && typeof o === "object" && !Array.isArray(o)) return o; } catch (e) {}
    return {};
  }
  var savedSort = lsGet(SORT_KEY);
  if (["shelf", "title", "author", "status"].indexOf(savedSort) >= 0) sortBy = savedSort;
  function isRead(b) { return readMap[b.id] === true; }
  function saveCustom() { lsSet(CUSTOM_KEY, JSON.stringify(custom)); }
  function allBooks() { return BUILTIN.filter(function (b) { return deleted.indexOf(b.id) < 0; }).concat(custom); }
  function cmpText(a, b) { return a.localeCompare(b, undefined, { sensitivity: "base", numeric: true }); }
  function sortKey(s) { return s.replace(/^(the|a|an)\s+/i, ""); }
  function visibleBooks() {
    var q = query.trim().toLowerCase();
    var list = allBooks().map(function (b, i) { return { b: b, i: i }; }).filter(function (x) {
      return !q || x.b.title.toLowerCase().indexOf(q) >= 0 || (x.b.author || "").toLowerCase().indexOf(q) >= 0;
    });
    list.sort(function (x, y) {
      var r = 0;
      if (sortBy === "title") r = cmpText(sortKey(x.b.title), sortKey(y.b.title));
      else if (sortBy === "author") {
        var ax = x.b.author || "", ay = y.b.author || "";
        if (!ax !== !ay) r = ax ? -1 : 1; else r = cmpText(ax, ay);
        if (!r) r = cmpText(sortKey(x.b.title), sortKey(y.b.title));
      } else if (sortBy === "status") {
        r = (isRead(x.b) ? 1 : 0) - (isRead(y.b) ? 1 : 0);
        if (!r) r = cmpText(sortKey(x.b.title), sortKey(y.b.title));
      }
      return r || x.i - y.i;
    });
    return list.map(function (x) { return x.b; });
  }

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function words(b) { return b.paras.join(" ").split(/\s+/).length; }
  function readPos(id) {
    try { var o = JSON.parse(lsGet(POS_KEY(id))); if (o && typeof o.f === "number") return o; } catch (e) {}
    return null;
  }

  // ---------- shelf ----------
  function renderShelf(focusSel) {
    var box = $("books"); box.innerHTML = "";
    var total = allBooks().length, list = visibleBooks();
    list.forEach(function (b) {
      var pos = readPos(b.id), pct = pos ? Math.round(pos.f * 100) : 0, rd = isRead(b);
      var cell = document.createElement("div");
      cell.className = "cell" + (b.id === freshId ? " fresh" : "") + (rd ? " isread" : ""); cell.dataset.id = b.id;
      var meta = b.custom ? "Added by you" : Math.max(1, Math.round(words(b) / 220)) + " min read";
      if (pos) meta += " &middot; " + (pct >= 100 ? "finished" : pct + "%");
      var el = document.createElement("button");
      el.className = "book"; el.type = "button"; el.style.setProperty("--c", b.color);
      el.setAttribute("aria-label", b.title + (b.author ? " by " + b.author : "") + (rd ? ", read" : ", unread") + (pos ? ", " + pct + " percent open" : ""));
      el.innerHTML = '<div class="in"><div class="orn">&#10086; ' + (b.custom ? "mine" : b.year) + '</div><h2>' + esc(b.title) + '</h2>' +
        (rd ? '<div class="stamp">&#10003; READ</div>' : '') +
        '<div class="by">' + esc(b.author || "Unknown author") + '</div>' +
        '<div class="meta">' + meta + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
      el.addEventListener("click", function () { openBook(b); });
      cell.appendChild(el);
      var pl = document.createElement("div"); pl.className = "plank"; pl.setAttribute("aria-hidden", "true"); cell.appendChild(pl);
      if (b.id === freshId) { var bd = document.createElement("div"); bd.className = "badge"; bd.textContent = "NEW"; cell.appendChild(bd); }
      var acts = document.createElement("div"); acts.className = "acts";
      var tg = document.createElement("button");
      tg.type = "button"; tg.className = "rd"; tg.setAttribute("aria-pressed", rd ? "true" : "false");
      tg.setAttribute("aria-label", (rd ? "Read. Tap to mark " : "Unread. Tap to mark ") + (rd ? "unread: " : "as read: ") + b.title);
      tg.innerHTML = '<span class="box">' + (rd ? "&#10003;" : "") + '</span>' + (rd ? "Read" : "Mark as read");
      tg.addEventListener("click", function () { toggleRead(b); });
      var dl = document.createElement("button");
      dl.type = "button"; dl.className = "dl"; dl.textContent = "Delete"; dl.setAttribute("aria-label", "Delete " + b.title);
      dl.addEventListener("click", function () { removeBook(b); });
      acts.appendChild(tg); acts.appendChild(dl); cell.appendChild(acts);
      box.appendChild(cell);
    });
    if (!list.length) box.appendChild(emptyState(total));
    var nRead = allBooks().filter(isRead).length;
    $("count").textContent = (query.trim() ? "Showing " + list.length + " of " + total + " books" : total + (total === 1 ? " book" : " books")) + (total ? " \u00B7 " + nRead + " read" : "");
    var rs = $("restore");
    rs.hidden = deleted.length === 0;
    rs.textContent = "Restore " + deleted.length + " deleted built-in " + (deleted.length === 1 ? "book" : "books");
    $("sbox").classList.toggle("has", query.length > 0);
    if (list.length) {
      var slot = document.createElement("div"); slot.className = "slot";
      var tile = document.createElement("button");
      tile.type = "button"; tile.className = "tile-add"; tile.innerHTML = '<span class="plus" aria-hidden="true">+</span>Add book';
      tile.addEventListener("click", openModal);
      slot.appendChild(tile);
      var pl2 = document.createElement("div"); pl2.className = "plank"; pl2.setAttribute("aria-hidden", "true"); slot.appendChild(pl2);
      box.appendChild(slot);
    }
    if (focusSel) { var f = document.querySelector(focusSel); if (f) f.focus(); }
  }

  function emptyState(total) {
    var em = document.createElement("div"); em.className = "empty";
    var icon = document.createElement("div"); icon.className = "ei"; icon.setAttribute("aria-hidden", "true");
    var h = document.createElement("h3"), p = document.createElement("p"), eb = document.createElement("div"); eb.className = "eb";
    function btn(label, fn, main) { var x = document.createElement("button"); x.type = "button"; x.textContent = label; if (main) x.className = "main"; x.addEventListener("click", fn); eb.appendChild(x); }
    if (total) {
      icon.innerHTML = "&#128269;";
      h.textContent = "No books match \u201C" + query.trim() + "\u201D";
      p.textContent = "Check the spelling, or try a shorter part of the title or author's name.";
      btn("Clear search", function () { query = ""; $("search").value = ""; renderShelf(".books .book"); }, true);
      btn("+ Add book", openModal);
    } else {
      icon.innerHTML = "&#128214;";
      h.textContent = "Your shelf is empty";
      p.textContent = deleted.length ? "Add a book of your own, or bring back the built-in stories." : "Tap \u201CAdd book\u201D to put your first book on the shelf.";
      btn("+ Add book", openModal, true);
      if (deleted.length) btn("Restore built-in books", restoreBuiltins);
    }
    em.appendChild(icon); em.appendChild(h); em.appendChild(p); em.appendChild(eb);
    return em;
  }

  function toggleRead(b) {
    if (isRead(b)) delete readMap[b.id]; else readMap[b.id] = true;
    lsSet(READ_KEY, JSON.stringify(readMap));
    renderShelf('.cell[data-id="' + b.id + '"] .rd');
    if (isRead(b)) toast("\u2713 Marked \u201C" + b.title + "\u201D as read", "ok"); else toast("Marked \u201C" + b.title + "\u201D as unread");
  }

  // ---------- add / remove ----------
  var modal = $("modal"), form = $("form"), inTitle = $("inTitle"), toastT;
  var sw = $("swatches");
  COLORS.forEach(function (c, i) {
    sw.insertAdjacentHTML("beforeend", '<input type="radio" name="color" id="c' + i + '" value="' + c + '"' + (i === 0 ? " checked" : "") + '>' +
      '<label for="c' + i + '" style="--c:' + c + '" title="Color ' + (i + 1) + '"></label>');
  });
  function toast(msg, kind) {
    var t = $("toast"); t.textContent = msg; t.className = "on" + (kind ? " " + kind : "");
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 3400);
  }
  function setErr(on) { $("fTitle").classList.toggle("bad", on); inTitle.setAttribute("aria-invalid", on ? "true" : "false"); }
  function openModal() {
    opener = document.activeElement;
    form.reset(); setErr(false);
    var n = custom.length % COLORS.length; $("c" + n).checked = true;
    modal.classList.add("open");
    setTimeout(function () { inTitle.focus(); }, 50);
  }
  var opener = null;
  function closeModal(noRestore) { modal.classList.remove("open"); if (noRestore !== true && opener && opener.focus && document.body.contains(opener)) opener.focus(); opener = null; }
  function submitBook(e) {
    e.preventDefault();
    var title = inTitle.value.replace(/\s+/g, " ").trim();
    if (!title) { setErr(true); inTitle.focus(); return; }
    var sel = form.querySelector('input[name="color"]:checked');
    var b = {
      id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: title,
      author: $("inAuthor").value.replace(/\s+/g, " ").trim(), note: $("inNote").value.trim(),
      color: sel ? sel.value : COLORS[0], year: "", custom: true
    };
    custom.push(b); saveCustom(); freshId = b.id;
    query = ""; $("search").value = "";
    closeModal(true); renderShelf();
    var cell = document.querySelector('.cell[data-id="' + b.id + '"]');
    var nb = cell && cell.querySelector(".book"); if (nb && nb.focus) nb.focus();
    if (cell && cell.scrollIntoView) cell.scrollIntoView({ behavior: "smooth", block: "center" });
    toast("\u2713 Added \u201C" + title + "\u201D to your shelf", "ok");
    setTimeout(function () { if (freshId === b.id) { freshId = null; var c = document.querySelector('.cell[data-id="' + b.id + '"]'); if (c) { c.classList.remove("fresh"); var bd = c.querySelector(".badge"); if (bd) bd.remove(); } } }, 6000);
  }
  function removeBook(b) {
    if (!window.confirm("Delete \u201C" + b.title + "\u201D from your shelf?")) return;
    var idx = visibleBooks().indexOf(b);
    if (b.custom) { custom = custom.filter(function (x) { return x.id !== b.id; }); saveCustom(); }
    else if (deleted.indexOf(b.id) < 0) { deleted.push(b.id); lsSet(DEL_KEY, JSON.stringify(deleted)); }
    delete readMap[b.id]; lsSet(READ_KEY, JSON.stringify(readMap));
    try { localStorage.removeItem(POS_KEY(b.id)); } catch (e) {}
    if (freshId === b.id) freshId = null;
    renderShelf();
    var after = document.querySelectorAll(".books .book");
    var tgt = after.length ? after[Math.min(idx, after.length - 1)] : $("count");
    if (tgt) tgt.focus();
    toast("Deleted \u201C" + b.title + "\u201D", "del");
  }
  function restoreBuiltins() {
    deleted = []; lsSet(DEL_KEY, "[]"); renderShelf();
    toast("\u2713 Built-in books restored", "ok");
  }
  $("restore").addEventListener("click", restoreBuiltins);
  $("search").addEventListener("input", function () { query = this.value; renderShelf(); });
  $("clearSearch").addEventListener("click", function () { query = ""; $("search").value = ""; renderShelf(); $("search").focus(); });
  $("sort").value = sortBy;
  $("sort").addEventListener("change", function () { sortBy = this.value; lsSet(SORT_KEY, sortBy); renderShelf(); });
  $("addBtn").addEventListener("click", openModal);
  $("cancelBtn").addEventListener("click", function () { closeModal(); });
  form.addEventListener("submit", submitBook);
  inTitle.addEventListener("input", function () { if (inTitle.value.trim()) setErr(false); });
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  modal.addEventListener("keydown", function (e) {
    if (e.key !== "Tab") return;
    var f = [].slice.call(modal.querySelectorAll("input:not([type=radio]), textarea, button, input[type=radio]:checked")).filter(function (x) { return !x.disabled; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && modal.classList.contains("open")) { e.stopImmediatePropagation(); closeModal(); } }, true);

  // ---------- reader ----------
  function buildFlow(b) {
    var h = '<h2 class="bt">' + esc(b.title) + '</h2>' + (b.author ? '<div class="ba">by ' + esc(b.author) + '</div>' : '');
    var paras = b.paras || (b.note ? b.note.split(/\n+/).filter(Boolean) : ["This book is still empty. It is a bookmark you added to your shelf."]);
    paras.forEach(function (p) {
      if (p === "* * *") { h += '<p class="sep">* * *</p>'; return; }
      h += "<p>" + esc(p).replace(/_([^_]+)_/g, "<em>$1</em>") + "</p>";
    });
    return h + (b.custom ? "" : '<p class="end">&mdash; The End &mdash;</p>');
  }

  function layout(keepFrac) {
    if (!cur) return;
    var f = typeof keepFrac === "number" ? keepFrac : (total > 1 ? page / (total - 1) : 0);
    var r = clip.getBoundingClientRect();
    pageW = Math.floor(r.width); gap = Math.max(24, Math.round(fontSize * 1.5));
    flow.style.fontSize = fontSize + "px";
    flow.style.width = pageW + "px";
    flow.style.columnWidth = pageW + "px";
    flow.style.columnGap = gap + "px";
    flow.style.webkitColumnWidth = pageW + "px";
    flow.style.webkitColumnGap = gap + "px";
    flow.style.transform = "none";
    total = Math.max(1, Math.round((flow.scrollWidth + gap) / (pageW + gap)));
    page = Math.min(total - 1, Math.max(0, Math.round(f * (total - 1))));
    show(false);
  }

  function show(save) {
    flow.style.transform = "translateX(" + (-page * (pageW + gap)) + "px)";
    $("pageInfo").textContent = (page + 1) + " / " + total;
    var frac = total > 1 ? page / (total - 1) : 1;
    $("prog").style.width = Math.round(frac * 100) + "%";
    $("prev").disabled = page === 0;
    $("next").disabled = page >= total - 1;
    if (save && cur) lsSet(POS_KEY(cur.id), JSON.stringify({ p: page, n: total, f: frac }));
  }

  function go(d) {
    var np = Math.min(total - 1, Math.max(0, page + d));
    if (np === page) return;
    page = np; show(true);
  }

  function openBook(b) {
    cur = b; $("rTitle").textContent = b.title;
    flow.innerHTML = buildFlow(b);
    shelf.classList.remove("active"); reader.classList.add("active");
    var pos = readPos(b.id);
    total = 1; page = 0;
    layout(pos ? pos.f : 0);
    show(true);
  }

  function closeBook() {
    var lastId = cur && cur.id;
    cur = null; reader.classList.remove("active"); shelf.classList.add("active");
    renderShelf(lastId ? '.cell[data-id="' + lastId + '"] .book' : null);
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  }

  function setSize(d) {
    var ns = Math.min(MAX_SIZE, Math.max(MIN_SIZE, fontSize + d));
    if (ns === fontSize) return;
    fontSize = ns; lsSet(SIZE_KEY, String(fontSize));
    layout(); show(true);
  }

  $("backBtn").addEventListener("click", closeBook);
  $("prev").addEventListener("click", function () { go(-1); });
  $("next").addEventListener("click", function () { go(1); });
  $("smaller").addEventListener("click", function () { setSize(-2); });
  $("bigger").addEventListener("click", function () { setSize(2); });

  document.addEventListener("keydown", function (e) {
    if (!cur) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    else if (e.key === "Escape") closeBook();
  });

  // swipe to turn pages
  var sx = 0, sy = 0, st = 0;
  var pb = $("pageBox");
  pb.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
  pb.addEventListener("touchend", function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 800) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (cur) { layout(); show(true); } }, 120); });

  renderShelf();
})();
</script>
</body>
</html>
