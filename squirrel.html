<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Squirrel Dash - Central Park</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(#7fd8ff 0%, #c9f1ff 30%, #8fe36b 30%, #5cc43c 100%);
    color: #3b2412;
    display: flex; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    overflow: hidden;
  }
  #app {
    width: 100%; max-width: 520px; padding: 12px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  h1 { margin: 4px 0 0; font-size: clamp(26px, 8vw, 40px); color: #ff5a1f; text-shadow: 0 3px 0 #fff, 0 5px 0 rgba(0,0,0,.15); letter-spacing: 1px; }
  .sub { margin: 0; font-weight: bold; color: #1b6e3a; font-size: 14px; }
  .hud { display: flex; gap: 10px; width: 100%; }
  .pill {
    flex: 1; background: #fff; border: 4px solid #ffb703; border-radius: 18px;
    text-align: center; padding: 6px 4px; box-shadow: 0 4px 0 #e08e00;
  }
  .pill small { display: block; font-size: 12px; font-weight: bold; color: #9a6b2f; text-transform: uppercase; }
  .pill b { font-size: 32px; line-height: 1.1; }
  #time.low { color: #e11d48; animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.2); } }

  .board-wrap { position: relative; width: 100%; }
  #board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    width: 100%; padding: 12px; border-radius: 24px;
    background: #4cb22f; border: 5px solid #2e8b1f; box-shadow: 0 6px 0 #236b17;
  }
  .hole { position: relative; aspect-ratio: 1; cursor: pointer; }
  .dirt {
    position: absolute; left: 4%; right: 4%; bottom: 8%; height: 46%;
    border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, #2a1608 0 45%, #5b3a1e 46% 70%, #8a5a2b 71%);
    border: 3px solid #6b4423;
  }
  .clip { position: absolute; left: 10%; right: 10%; top: 0; bottom: 30%; overflow: hidden; }
  .sq {
    position: absolute; left: 0; right: 0; bottom: -100%; text-align: center;
    font-size: clamp(48px, 17vw, 88px); line-height: 1;
    transition: bottom .12s ease-out;
  }
  .hole.up .sq { bottom: 0; }
  .rim {
    position: absolute; left: 0; right: 0; bottom: 6%; height: 26%;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    background: #8a5a2b; border: 3px solid #6b4423; border-top: none; pointer-events: none;
  }
  .chirp {
    position: absolute; left: 50%; top: 10%; transform: translateX(-50%);
    font-weight: 900; font-size: 22px; color: #fff; background: #ff5a1f;
    padding: 2px 10px; border-radius: 14px; pointer-events: none;
    animation: chirp .5s ease-out forwards; z-index: 3; white-space: nowrap;
  }
  @keyframes chirp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(.6); }
    100% { opacity: 0; transform: translate(-50%, -40px) scale(1.3); }
  }
  .burst { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #fff7a8 0, rgba(255,230,0,0) 65%); animation: burst .35s ease-out forwards; pointer-events: none; z-index: 2; }
  @keyframes burst { from { opacity: 1; transform: scale(.3); } to { opacity: 0; transform: scale(1.4); } }

  .overlay {
    position: absolute; inset: 0; border-radius: 24px; z-index: 5;
    background: rgba(255, 247, 214, .93); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: clamp(24px, 7vw, 34px); color: #ff5a1f; }
  .overlay p { margin: 0; font-size: 18px; font-weight: bold; }
  .big {
    font: inherit; font-size: clamp(32px, 10vw, 48px); font-weight: 900; color: #fff;
    background: linear-gradient(#ff8a3d, #ff5a1f); border: 5px solid #fff; border-radius: 999px;
    padding: 14px 44px; min-height: 72px; cursor: pointer; box-shadow: 0 7px 0 #c2410c;
  }
  .big:active { transform: translateY(5px); box-shadow: 0 2px 0 #c2410c; }
  .best { color: #1b6e3a; }
  .newbest { color: #e11d48; }
</style>
</head>
<body>
<div id="app">
  <h1>🐿️ Squirrel Dash</h1>
  <p class="sub">Central Park Edition 🌳</p>
  <div class="hud">
    <div class="pill"><small>Time</small><b id="time">30</b></div>
    <div class="pill"><small>Score</small><b id="score">0</b></div>
    <div class="pill"><small>Best</small><b id="best">0</b></div>
  </div>
  <div class="board-wrap">
    <div id="board"></div>
    <div id="start" class="overlay">
      <h2>Catch the squirrels!</h2>
      <p>Tap them before they hide.</p>
      <button class="big" id="startBtn">Start</button>
    </div>
    <div id="end" class="overlay hidden">
      <h2 id="endTitle">Time! Your score: 0</h2>
      <p class="best" id="endBest"></p>
      <button class="big" id="againBtn">Play again</button>
    </div>
  </div>
</div>

<script>
(function () {
  var GAME_SECONDS = 30, UP_MS = 800, KEY = "squirrelDashBest";
  var board = document.getElementById("board");
  var timeEl = document.getElementById("time");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var startOv = document.getElementById("start");
  var endOv = document.getElementById("end");
  var holes = [];
  var score = 0, running = false, endAt = 0;
  var tickId = null, spawnId = null;
  var upTimers = [];

  function getBest() { try { return parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) { return 0; } }
  function setBest(v) { try { localStorage.setItem(KEY, String(v)); } catch (e) {} }
  bestEl.textContent = getBest();

  for (var i = 0; i < 9; i++) {
    var h = document.createElement("div");
    h.className = "hole";
    h.innerHTML = '<div class="dirt"></div><div class="clip"><div class="sq">🐿️</div></div><div class="rim"></div>';
    board.appendChild(h);
    holes.push(h);
    upTimers.push(null);
    (function (idx) {
      h.addEventListener("pointerdown", function (e) { e.preventDefault(); whack(idx); });
    })(i);
  }

  function hide(idx) {
    clearTimeout(upTimers[idx]); upTimers[idx] = null;
    holes[idx].classList.remove("up");
  }

  function popUp() {
    if (!running) return;
    var free = [];
    holes.forEach(function (h, i) { if (!h.classList.contains("up")) free.push(i); });
    if (!free.length) return;
    var idx = free[Math.floor(Math.random() * free.length)];
    holes[idx].classList.add("up");
    upTimers[idx] = setTimeout(function () { hide(idx); }, UP_MS);
  }

  function whack(idx) {
    if (!running || !holes[idx].classList.contains("up")) return;
    hide(idx);
    score++;
    scoreEl.textContent = score;
    var hole = holes[idx];
    var b = document.createElement("div"); b.className = "burst";
    var c = document.createElement("div"); c.className = "chirp"; c.textContent = "Chirp!";
    hole.appendChild(b); hole.appendChild(c);
    setTimeout(function () { b.remove(); c.remove(); }, 550);
  }

  function tick() {
    var left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    timeEl.textContent = left;
    timeEl.classList.toggle("low", left <= 5);
    if (left <= 0) finish();
  }

  function scheduleSpawn() {
    // gets slightly faster as time runs out
    var elapsed = GAME_SECONDS - (endAt - Date.now()) / 1000;
    var delay = Math.max(350, 750 - elapsed * 12) + Math.random() * 250;
    spawnId = setTimeout(function () { popUp(); if (running) scheduleSpawn(); }, delay);
  }

  function start() {
    score = 0; running = true;
    scoreEl.textContent = 0;
    startOv.classList.add("hidden");
    endOv.classList.add("hidden");
    holes.forEach(function (_, i) { hide(i); });
    endAt = Date.now() + GAME_SECONDS * 1000;
    tick();
    tickId = setInterval(tick, 100);
    setTimeout(popUp, 300);
    scheduleSpawn();
  }

  function finish() {
    running = false;
    clearInterval(tickId); clearTimeout(spawnId);
    holes.forEach(function (_, i) { hide(i); });
    timeEl.classList.remove("low");
    var best = getBest(), isNew = score > best;
    if (isNew) { best = score; setBest(best); }
    bestEl.textContent = best;
    document.getElementById("endTitle").textContent = "Time! Your score: " + score;
    var eb = document.getElementById("endBest");
    eb.className = isNew ? "newbest" : "best";
    eb.textContent = isNew ? "🎉 New best score: " + best + "!" : "Best score: " + best;
    endOv.classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("againBtn").addEventListener("click", start);
})();
</script>
</body>
</html>
